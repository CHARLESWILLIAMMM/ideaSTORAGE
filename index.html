<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Workflow Vault</title>
  <meta name="description" content="Save and organize your AI prompts in a futuristic vault." />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ░░ HEADER ░░ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">AI <strong>Workflow</strong> Vault</span>
      </div>
      <p class="header-sub">Your personal prompt control panel</p>
    </div>
  </header>

  <main class="container">

    <!-- ░░ INPUT PANEL ░░ -->
    <section class="panel input-panel" aria-labelledby="input-heading">
      <h2 id="input-heading" class="panel-title">
        <span class="panel-icon">✦</span> New Prompt
      </h2>

      <div class="form-group">
        <label for="prompt-title">Title</label>
        <input
          type="text"
          id="prompt-title"
          class="input-field"
          placeholder="Give your prompt a name…"
          maxlength="100"
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="prompt-category">Category</label>
        <div class="select-wrapper">
          <select id="prompt-category" class="input-field select-field">
            <option value="" disabled selected>Choose a category…</option>
            <option value="Coding">💻 Coding</option>
            <option value="Writing">✍️ Writing</option>
            <option value="Games">🎮 Games</option>
            <option value="School">📚 School</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
      </div>

      <div class="form-group">
        <label for="prompt-body">AI Prompt</label>
        <textarea
          id="prompt-body"
          class="input-field textarea-field"
          placeholder="Type your AI prompt here…"
          maxlength="5000"
        ></textarea>
        <span class="char-count" id="char-count">0 / 5000</span>
      </div>

      <button id="save-btn" class="btn btn-primary" type="button">
        <span class="btn-icon">💾</span> Save Prompt
      </button>

      <div id="save-toast" class="toast" role="alert" aria-live="polite"></div>
    </section>

    <!-- ░░ BOOKSHELF ░░ -->
    <section class="panel bookshelf-panel" aria-labelledby="shelf-heading">
      <div class="shelf-header">
        <h2 id="shelf-heading" class="panel-title">
          <span class="panel-icon">📂</span> The Bookshelf
        </h2>
        <span class="prompt-count" id="prompt-count">0 prompts</span>
      </div>

      <!-- Category filter buttons -->
      <div class="filter-bar" id="filter-bar" role="group" aria-label="Filter by category">
        <button class="btn btn-filter active" data-filter="All">All</button>
        <button class="btn btn-filter" data-filter="Coding">💻 Coding</button>
        <button class="btn btn-filter" data-filter="Writing">✍️ Writing</button>
        <button class="btn btn-filter" data-filter="Games">🎮 Games</button>
        <button class="btn btn-filter" data-filter="School">📚 School</button>
      </div>

      <!-- Prompt cards list -->
      <div class="prompt-list" id="prompt-list" aria-live="polite">
        <!-- Cards injected by JS -->
      </div>

      <p class="empty-state" id="empty-state" hidden>
        No prompts here yet. Start adding some above! 🚀
      </p>
    </section>

  </main>

  <footer class="site-footer">
    <p>AI Workflow Vault &mdash; built with ❤️ &amp; Local Storage</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
